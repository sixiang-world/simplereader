name: Tests

on:
  push:
    branches:
      - main
      - dev
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: |
          node test/test-issue-12.mjs
          node test/test-url-settings.mjs
        working-directory: ${{ github.workspace }}
