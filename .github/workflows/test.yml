name: Tests

on:
  push:
    branches:
      - main
      - dev
      - feature/**
      - refactor/**
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # (v2 refactor) The project now ships a package.json with a `test`
      # script that runs ALL test suites in sequence (22 test files under
      # test/, covering T2S, presets, pre-pagination, hooks, config sync,
      # worker resolution, CSS/i18n completeness, build integration, etc.).
      # The `build` step below is REQUIRED: test-build-integration.mjs
      # asserts that dist/ exists and contains the production artifacts.
      - name: Setup pnpm via corepack
        run: corepack enable

      - name: Lint
        run: pnpm run lint

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-audit --no-fund

      - name: Build production bundle
        run: pnpm run build

      - name: Run all tests
        run: pnpm run test
        working-directory: ${{ github.workspace }}
