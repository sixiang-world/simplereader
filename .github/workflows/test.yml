name: Tests

on:
  push:
    branches:
      - main
      - dev
      - feature/**
      - feat/**
      - refactor/**
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm via corepack
        run: corepack enable

      # Install MUST come before lint/typecheck/build/test — none of those
      # tools exist in node_modules until dependencies are installed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and Firefox for browser regression tests
        run: pnpm exec playwright-core install --with-deps chromium firefox

      - name: Validate production workflow
        run: pnpm run validate
