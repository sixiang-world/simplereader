# .cnb/web_trigger.yml — Web 手动触发按钮
#
# 在仓库页面显示「部署到生产」按钮，点击后触发 .cnb.yml 中
# $: web_trigger_deploy_production 流水线。
# 建议仅在 dev/main 分支可用，避免从任意分支误部署生产。

branch:
  - reg: ^(dev|main)$
    buttons:
      - name: 部署到生产
        event: web_trigger_deploy_production
        description: 构建 dist 并部署到 EdgeOne Pages 生产环境
        permissions:
          roles: [master, developer]
