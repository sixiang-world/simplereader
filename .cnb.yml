# .cnb.yml — CNB 流水线
#
# 流水线总览：
#   push（所有分支自动触发，并行）：
#     1a. sync-to-github → 当前分支 + tags 镜像到 GitHub（$ 兜底，所有分支生效）
#     1b. build-and-deploy-preview → dev 分支构建 + 部署 EdgeOne Pages 预发环境
#     1c. build-and-deploy-production → main 分支构建 + 部署 EdgeOne Pages 生产环境
#   手动触发（web_trigger，见 .cnb/web_trigger.yml）：
#     - 部署到生产（仅 main）
#     - 部署到 DEV（仅 main）
#     - 同步 GitHub（仅 main）
#     - 部署到 DEV（其余分支）
#     - 同步 GitHub（其余分支）
#
# 密钥仓库（shisheng820/secret）：
#   - edgeone.yml → EDGEONE_PAGES_API_TOKEN
#   - github.yml  → GITHUB_TOKEN
#   仓库内文件格式：KEY: <value>
#
# 部署前提：
#   - 已在 EdgeOne Makers 控制台创建项目 "simplereader"
#   - 已获取 EdgeOne Pages API Token
#   - 已创建密钥仓库并配置 EDGEONE_PAGES_API_TOKEN
#
# 以 . 开头的 key 不会被识别为分支名，用作可复用片段（YAML 锚点）。

# ===== 公共配置：Node 构建环境 =====
.node-env: &node-env
  docker:
    image: node:20.18.0-alpine

# ===== 公共构建阶段 =====
.install: &install
  name: install
  script: |
    corepack enable
    corepack prepare pnpm@9.12.0 --activate
    pnpm install --frozen-lockfile

.build: &build
  name: build
  script: pnpm run build

.verify-dist: &verify-dist
  name: verify-dist
  script: |
    if [ ! -d dist ]; then
      echo "ERROR: dist/ not found after build"
      exit 1
    fi
    echo "dist size: $(du -sh dist | cut -f1)"

# ===== GitHub 同步：当前分支 + 所有 tags =====
.sync-github-stages: &sync-github-stages
  - name: validate-token
    script: |
      if [ -z "$GITHUB_TOKEN" ]; then
        echo "ERROR: GITHUB_TOKEN is required (from secret repo github.yml)"
        exit 78
      fi
  - name: configure-git
    script: |
      git config user.name "cnb-sync[bot]"
      git config user.email "cnb-sync[bot]@users.noreply.github.com"
  - name: add-github-remote
    script: |
      # 幂等设置/添加 github remote（URL 含 token，不打印）
      if git remote get-url github >/dev/null 2>&1; then
        git remote set-url github "https://x-access-token:${GITHUB_TOKEN}@github.com/sixiang-world/simplereader.git"
      else
        git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/sixiang-world/simplereader.git"
      fi
      # 校验 token 被注入：URL 里不能含字面量 $GITHUB_TOKEN 或空 token
      URL="$(git remote get-url github)"
      case "$URL" in
        *'$GITHUB_TOKEN'*|*'x-access-token:@'*)
          echo "ERROR: GITHUB_TOKEN not substituted or empty in remote URL"
          exit 78
          ;;
      esac
      echo "github remote configured (token hidden)"
  - name: push-branch-and-tags
    script: |
      BRANCH="${CNB_BRANCH}"
      echo "Pushing branch: ${BRANCH}"
      git push github "${BRANCH}" 2>&1 || echo "WARN: failed to push branch ${BRANCH}"
      echo "Pushing all tags..."
      git push github --tags 2>&1 || echo "WARN: failed to push some tags"

# ===== 1. dev 分支 push → 构建并部署预发环境 =====
dev:
  push:
    - name: build-and-deploy-preview
      <<: *node-env
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/edgeone.yml
      lock:
        key: deploy-eopages-preview
        wait: true
        cancel-in-wait: true
      stages:
        - *install
        - *build
        - *verify-dist
        - name: 部署到 EdgeOne Pages 预发环境
          image: tencentcom/deploy-eopages:latest
          settings:
            project_name: simplereader
            api_token: $EDGEONE_PAGES_API_TOKEN
            directory: ./dist
            environment: preview

    - name: sync-to-github
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/github.yml
      docker:
        image: alpine/git:latest
      stages: *sync-github-stages

# ===== 2. main 分支 push → 构建并部署生产环境 =====
main:
  push:
    - name: build-and-deploy-production
      <<: *node-env
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/edgeone.yml
      # 与手动部署共用同一把锁，避免自动/手动同时发生产
      lock:
        key: deploy-eopages-production
        wait: true
        cancel-in-wait: true
      stages:
        - *install
        - *build
        - *verify-dist
        # 不传 environment 即部署到生产环境
        - name: 部署到 EdgeOne Pages 生产环境
          image: tencentcom/deploy-eopages:latest
          settings:
            project_name: simplereader
            api_token: $EDGEONE_PAGES_API_TOKEN
            directory: ./dist

    - name: sync-to-github
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/github.yml
      docker:
        image: alpine/git:latest
      stages: *sync-github-stages

# ===== 3. $ 兜底（所有其他分支）push → 自动同步 GitHub =====
$:
  push:
    - name: sync-to-github
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/github.yml
      docker:
        image: alpine/git:latest
      stages: *sync-github-stages

  # ===== 手动触发：部署生产（仅 main 显示） =====
  web_trigger_deploy_production:
    - name: deploy-production
      <<: *node-env
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/edgeone.yml
      lock:
        key: deploy-eopages-production
        wait: true
        cancel-in-wait: true
      stages:
        - *install
        - *build
        - *verify-dist
        - name: 部署到 EdgeOne Pages 生产环境
          image: tencentcom/deploy-eopages:latest
          settings:
            project_name: simplereader
            api_token: $EDGEONE_PAGES_API_TOKEN
            directory: ./dist

  # ===== 手动触发：部署 DEV 预发环境（main + 其他分支显示） =====
  web_trigger_deploy_preview:
    - name: deploy-preview
      <<: *node-env
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/edgeone.yml
      lock:
        key: deploy-eopages-preview
        wait: true
        cancel-in-wait: true
      stages:
        - *install
        - *build
        - *verify-dist
        - name: 部署到 EdgeOne Pages 预发环境
          image: tencentcom/deploy-eopages:latest
          settings:
            project_name: simplereader
            api_token: $EDGEONE_PAGES_API_TOKEN
            directory: ./dist
            environment: preview

  # ===== 手动触发：同步到 GitHub（main + 其他分支显示） =====
  web_trigger_sync_github:
    - name: sync-to-github
      docker:
        image: alpine/git:latest
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/github.yml
      stages: *sync-github-stages
