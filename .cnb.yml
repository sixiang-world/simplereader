# .cnb.yml — CNB 流水线
#
# 流水线总览：
#   push（所有分支自动触发，并行）：
#     1a. sync-to-github → 仅当前分支镜像到 GitHub（$ 兜底，所有分支生效）
#     1b. build-and-deploy-preview → dev 分支构建 + 部署 EdgeOne Pages 预发环境
#     1c. build-and-deploy-production → main 分支构建 + 部署 EdgeOne Pages 生产环境
#   手动触发（web_trigger，见 .cnb/web_trigger.yml）：
#     - 部署到生产（仅 main；执行端仍独立校验分支）
#     - 部署到 DEV（main + 其余分支）
#     - 同步 GitHub（仅当前分支，不带标签）
#     - 发布同步（仅 main；分支 + 标签，正式发布任务专用）
#
# 密钥仓库（shisheng820/secret）：
#   - edgeone.yml → EDGEONE_PAGES_API_TOKEN
#   - github.yml  → GITHUB_TOKEN
#   仓库内文件格式：KEY: <value>
#
# 安全约定（E01）：
#   - GITHUB_TOKEN 只通过临时 credential helper 在 push 进程内使用，
#     不写入任何 remote URL 或 git 配置（原实现把 token 拼进 remote URL）。
#   - 生产部署入口（main push 与手动按钮）都在执行端强制校验 CNB_BRANCH == main；
#     web_trigger.yml 的分支正则只控制按钮可见性，不作为权限边界。
#   - 常规同步只推当前分支；标签只在"发布同步"手动任务中推送。
#   - 部署只消费本流水线验证通过的 dist/，并把源码 SHA / 版本写入 dist/BUILD_INFO.json。
#   - 镜像固定版本 tag（digest 见各行注释），不使用 latest。
#
# 部署前提：
#   - 已在 EdgeOne Makers 控制台创建项目 "simplereader"
#   - 已获取 EdgeOne Pages API Token
#   - 已创建密钥仓库并配置 EDGEONE_PAGES_API_TOKEN
#
# 以 . 开头的 key 不会被识别为分支名，用作可复用片段（YAML 锚点）。

# ===== 公共配置：Node 构建环境 =====
# docker.build 按 build-tools/ci/Dockerfile 内容哈希动态构建构建环境镜像，
# 平台自动缓存并推送到本项目制品库，后续构建直接复用（首次构建后）。
# python3 + chromium 预装进镜像，install 不再每次 apk add（曾 ~1m8s / 804MiB）。
# volumes 缓存 pnpm store（节点级 copy-on-write），依赖安装只剩链接开销。
.node-env: &node-env
  docker:
    build: build-tools/ci/Dockerfile
    volumes:
      - /root/.local/share/pnpm/store

# ===== 公共构建阶段 =====
# 系统依赖已在构建环境镜像内，此阶段只准备 pnpm 并装 Node 依赖
.install: &install
  name: install
  script: |
    corepack enable
    corepack prepare pnpm@9.12.0 --activate
    pnpm install --frozen-lockfile

.validate: &validate
  name: validate
  script: sh build-tools/validate.sh

.verify-dist: &verify-dist
  name: verify-dist
  script: |
    if [ ! -d dist ]; then
      echo "ERROR: dist/ not found after build"
      exit 1
    fi
    echo "dist size: $(du -sh dist | cut -f1)"

# 记录部署产物对应的源码 SHA 与版本（发布记录可对应该次产物）。
# 注意：阶段容器（node:22-alpine）里没有 git 二进制——用 CNB 内置的
# CNB_COMMIT 提供源码 SHA，禁止在此处调用 git rev-parse（曾致 exit 127、
# 预发部署在部署前失败）。
.record-build-info: &record-build-info
  name: record-build-info
  script: |
    COMMIT="${CNB_COMMIT:-unknown}"
    VERSION="$(node -p "require('./version.json').version")"
    printf '{"commit":"%s","version":"%s","branch":"%s","builtAt":"%s"}\n' \
      "${COMMIT}" "${VERSION}" "${CNB_BRANCH}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
      > dist/BUILD_INFO.json
    echo "deploying ${VERSION} from ${CNB_BRANCH}@${COMMIT}"

# 生产入口执行端校验：按钮可见性之外，部署前必须确认在 main
.guard-production: &guard-production
  name: guard-production-branch
  script: |
    BRANCH="${CNB_BRANCH:-}"
    if [ "${BRANCH}" != "main" ]; then
      echo "ERROR: production deploy requires branch 'main' (got '${BRANCH}')"
      exit 78
    fi
    echo "production deploy approved for main@${CNB_COMMIT:-unknown}"

# ===== GitHub 同步：临时凭证，token 不落盘 =====
# push 直接指向 URL，不配置 github remote；credential helper 为一次性内联函数，
# $GITHUB_TOKEN 在 helper 执行时才从环境展开，不出现在任何 argv、配置或日志中。
# 常规同步只推当前分支；标签由"发布同步"任务显式推送。
.sync-github-stages: &sync-github-stages
  - name: validate-token
    script: |
      if [ -z "$GITHUB_TOKEN" ]; then
        echo "ERROR: GITHUB_TOKEN is required (from secret repo github.yml)"
        exit 78
      fi
  - name: push-branch
    script: |
      BRANCH="${CNB_BRANCH}"
      echo "Pushing branch: ${BRANCH} (tags excluded; use the release sync task for tags)"
      git -c credential.helper= \
          -c credential.helper='!f() { echo "username=x-access-token"; echo "password=$GITHUB_TOKEN"; }; f' \
          push https://github.com/sixiang-world/simplereader.git "${BRANCH}"

# 发布同步：仅 main 手动触发，分支 + 标签（见 web_trigger.yml 的 ^main$ 分组）
.sync-github-release-stages: &sync-github-release-stages
  - name: validate-token
    script: |
      if [ -z "$GITHUB_TOKEN" ]; then
        echo "ERROR: GITHUB_TOKEN is required (from secret repo github.yml)"
        exit 78
      fi
  - name: guard-main
    script: |
      BRANCH="${CNB_BRANCH:-}"
      if [ "${BRANCH}" != "main" ]; then
        echo "ERROR: release sync requires branch 'main' (got '${BRANCH}')"
        exit 78
      fi
  - name: push-branch-and-tags
    script: |
      echo "Pushing main and tags"
      git -c credential.helper= \
          -c credential.helper='!f() { echo "username=x-access-token"; echo "password=$GITHUB_TOKEN"; }; f' \
          push https://github.com/sixiang-world/simplereader.git main
      git -c credential.helper= \
          -c credential.helper='!f() { echo "username=x-access-token"; echo "password=$GITHUB_TOKEN"; }; f' \
          push https://github.com/sixiang-world/simplereader.git --tags

# ===== 1. dev 分支 push → 构建并部署预发环境 =====
dev:
  push:
    - name: build-and-deploy-preview
      <<: *node-env
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/edgeone.yml
      lock:
        key: deploy-eopages-preview
        wait: true
        cancel-in-wait: true
      stages:
        - *install
        - *validate
        - *verify-dist
        - *record-build-info
        - name: 部署到 EdgeOne Pages 预发环境
          # v1.7.3 = sha256:0e79d28be64a6c3b85a9236c9a51fcb97d5c2ca7120a6c7feddd0b85ac38874b
          image: tencentcom/deploy-eopages:v1.7.3
          settings:
            project_name: simplereader
            api_token: $EDGEONE_PAGES_API_TOKEN
            directory: ./dist
            environment: preview

    - name: sync-to-github
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/github.yml
      docker:
        # v2.54.0 = sha256:e8ceedc73bd80992ae8d58a7d24c58b8322146c354f1d2e81a97db4452068ec0
        image: alpine/git:v2.54.0
      stages: *sync-github-stages

# ===== 2. main 分支 push → 构建并部署生产环境 =====
main:
  push:
    - name: build-and-deploy-production
      <<: *node-env
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/edgeone.yml
      # 与手动部署共用同一把锁，避免自动/手动同时发生产
      lock:
        key: deploy-eopages-production
        wait: true
        cancel-in-wait: true
      stages:
        - *guard-production
        - *install
        - *validate
        - *verify-dist
        - *record-build-info
        # 不传 environment 即部署到生产环境
        - name: 部署到 EdgeOne Pages 生产环境
          # v1.7.3 = sha256:0e79d28be64a6c3b85a9236c9a51fcb97d5c2ca7120a6c7feddd0b85ac38874b
          image: tencentcom/deploy-eopages:v1.7.3
          settings:
            project_name: simplereader
            api_token: $EDGEONE_PAGES_API_TOKEN
            directory: ./dist

    - name: sync-to-github
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/github.yml
      docker:
        # v2.54.0 = sha256:e8ceedc73bd80992ae8d58a7d24c58b8322146c354f1d2e81a97db4452068ec0
        image: alpine/git:v2.54.0
      stages: *sync-github-stages

# ===== 3. $ 兜底（所有其他分支）push → 自动同步 GitHub（仅当前分支） =====
$:
  push:
    - name: sync-to-github
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/github.yml
      docker:
        # v2.54.0 = sha256:e8ceedc73bd80992ae8d58a7d24c58b8322146c354f1d2e81a97db4452068ec0
        image: alpine/git:v2.54.0
      stages: *sync-github-stages

  # ===== 手动触发：部署生产（按钮仅 main 可见；执行端仍校验） =====
  web_trigger_deploy_production:
    - name: deploy-production
      <<: *node-env
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/edgeone.yml
      lock:
        key: deploy-eopages-production
        wait: true
        cancel-in-wait: true
      stages:
        - *guard-production
        - *install
        - *validate
        - *verify-dist
        - *record-build-info
        - name: 部署到 EdgeOne Pages 生产环境
          # v1.7.3 = sha256:0e79d28be64a6c3b85a9236c9a51fcb97d5c2ca7120a6c7feddd0b85ac38874b
          image: tencentcom/deploy-eopages:v1.7.3
          settings:
            project_name: simplereader
            api_token: $EDGEONE_PAGES_API_TOKEN
            directory: ./dist

  # ===== 手动触发：部署 DEV 预发环境（main + 其他分支显示） =====
  web_trigger_deploy_preview:
    - name: deploy-preview
      <<: *node-env
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/edgeone.yml
      lock:
        key: deploy-eopages-preview
        wait: true
        cancel-in-wait: true
      stages:
        - *install
        - *validate
        - *verify-dist
        - *record-build-info
        - name: 部署到 EdgeOne Pages 预发环境
          # v1.7.3 = sha256:0e79d28be64a6c3b85a9236c9a51fcb97d5c2ca7120a6c7feddd0b85ac38874b
          image: tencentcom/deploy-eopages:v1.7.3
          settings:
            project_name: simplereader
            api_token: $EDGEONE_PAGES_API_TOKEN
            directory: ./dist
            environment: preview

  # ===== 手动触发：同步到 GitHub（main + 其他分支显示；仅当前分支） =====
  web_trigger_sync_github:
    - name: sync-to-github
      docker:
        # v2.54.0 = sha256:e8ceedc73bd80992ae8d58a7d24c58b8322146c354f1d2e81a97db4452068ec0
        image: alpine/git:v2.54.0
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/github.yml
      stages: *sync-github-stages

  # ===== 手动触发：发布同步（仅 main 显示；分支 + 标签） =====
  web_trigger_release_sync:
    - name: release-sync-github
      docker:
        # v2.54.0 = sha256:e8ceedc73bd80992ae8d58a7d24c58b8322146c354f1d2e81a97db4452068ec0
        image: alpine/git:v2.54.0
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/github.yml
      stages: *sync-github-release-stages
