# .cnb.yml — CNB 流水线
#
# 流水线总览：
#   dev 分支 push 自动触发（两条并行流水线）：
#     1a. build-and-deploy-preview → 构建 + 部署 EdgeOne Pages 预发环境
#     1b. sync-to-github          → 推送 dev 分支和 tags 到 GitHub 镜像
#   手动触发（$ 兜底）：
#     2. web_trigger_deploy_production → 构建 + 部署 EdgeOne Pages 生产环境
#     3. web_trigger.sync-to-github    → 推送到 GitHub（备用，手动控制 force/分支）
#
# 密钥仓库（shisheng820/secret）：
#   - edgeone.yml → EDGEONE_PAGES_API_TOKEN
#   - github.yml  → GITHUB_TOKEN
#   仓库内文件格式：KEY: <value>
#
# 部署前提：
#   - 已在 EdgeOne Makers 控制台创建项目 "simplereader"
#   - 已获取 EdgeOne Pages API Token
#   - 已创建密钥仓库并配置 EDGEONE_PAGES_API_TOKEN

# ===== 1. dev 分支 push → 自动部署预发环境 =====
dev:
  push:
    - name: build-and-deploy-preview
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/edgeone.yml
      docker:
        image: node:20.18.0-alpine
      # 部署防并发：只保留最新排队的流水线
      lock:
        key: deploy-eopages-preview
        wait: true
        cancel-in-wait: true
      stages:
        - name: install
          script: |
            corepack enable
            corepack prepare pnpm@9.12.0 --activate
            pnpm install --frozen-lockfile --no-audit --no-fund
        - name: build
          script: pnpm run build
        - name: verify-dist
          script: |
            if [ ! -d dist ]; then
              echo "ERROR: dist/ not found after build"
              exit 1
            fi
            echo "dist size: $(du -sh dist | cut -f1)"
        - name: 部署到 EdgeOne Pages 预发环境
          image: tencentcom/deploy-eopages:latest
          settings:
            project_name: simplereader
            api_token: $EDGEONE_PAGES_API_TOKEN
            directory: ./dist
            environment: preview

    - name: sync-to-github
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/github.yml
      docker:
        image: alpine/git:latest
      env:
        GITHUB_TOKEN: $GITHUB_TOKEN
      stages:
        - name: validate-token
          script: |
            if [ -z "$GITHUB_TOKEN" ]; then
              echo "ERROR: GITHUB_TOKEN is required (from secret repo github.yml)"
              exit 78
            fi
        - name: configure-git
          script: |
            git config user.name "cnb-sync[bot]"
            git config user.email "cnb-sync[bot]@users.noreply.github.com"
        - name: add-github-remote
          script: |
            git remote add github https://x-access-token:${GITHUB_TOKEN}@github.com/sixiang-world/simplereader.git || \
              git remote set-url github https://x-access-token:${GITHUB_TOKEN}@github.com/sixiang-world/simplereader.git
        - name: push-branch-and-tags
          script: |
            echo "Pushing branch: dev"
            git push github dev 2>&1 || echo "WARN: failed to push branch dev"
            echo "Pushing all tags..."
            git push github --tags 2>&1 || echo "WARN: failed to push some tags"

# ===== 2. 手动触发 → 部署生产环境 =====
$:
  web_trigger_deploy_production:
    - name: deploy-production
      imports:
        - https://cnb.cool/shisheng820/secret/-/blob/main/edgeone.yml
      lock:
        key: deploy-eopages-production
        wait: true
        cancel-in-wait: true
      docker:
        image: node:20.18.0-alpine
      stages:
        - name: install
          script: |
            corepack enable
            corepack prepare pnpm@9.12.0 --activate
            pnpm install --frozen-lockfile --no-audit --no-fund
        - name: build
          script: pnpm run build
        - name: verify-dist
          script: |
            if [ ! -d dist ]; then
              echo "ERROR: dist/ not found after build"
              exit 1
            fi
            echo "dist size: $(du -sh dist | cut -f1)"
        - name: 部署到 EdgeOne Pages 生产环境
          image: tencentcom/deploy-eopages:latest
          settings:
            project_name: simplereader
            api_token: $EDGEONE_PAGES_API_TOKEN
            directory: ./dist

  # ===== 3. 手动触发 → 推送到 GitHub 镜像（原有功能） =====
  web_trigger:
    - name: sync-to-github
      docker:
        image: alpine/git:latest
      env:
        GITHUB_TOKEN: $GITHUB_TOKEN
      stages:
        - name: validate-token
          script: |
            if [ -z "$GITHUB_TOKEN" ]; then
              echo "ERROR: GITHUB_TOKEN environment variable is required"
              echo "Please set GITHUB_TOKEN in CNB pipeline secrets"
              exit 78
            fi

        - name: configure-git
          script: |
            git config user.name "cnb-sync[bot]"
            git config user.email "cnb-sync[bot]@users.noreply.github.com"

        - name: add-github-remote
          script: |
            git remote add github https://x-access-token:${GITHUB_TOKEN}@github.com/sixiang-world/simplereader.git || \
              git remote set-url github https://x-access-token:${GITHUB_TOKEN}@github.com/sixiang-world/simplereader.git

        - name: push-branches
          script: |
            FORCE_FLAG=""
            if [ "${FORCE_PUSH}" = "true" ]; then
              FORCE_FLAG="--force"
            fi

            BRANCHES="${PUSH_BRANCH}"
            if [ -z "$BRANCHES" ]; then
              BRANCHES=$(git branch --format='%(refname:short)' 2>/dev/null || git branch | sed 's/^\* //')
            fi

            for BRANCH in $BRANCHES; do
              if [ "${DRY_RUN}" = "true" ]; then
                echo "[DRY RUN] Would push: branch ${BRANCH} -> github ${BRANCH} ${FORCE_FLAG}"
              else
                echo "Pushing branch: ${BRANCH}"
                git push github "${BRANCH}" ${FORCE_FLAG} 2>&1 || echo "WARN: failed to push branch ${BRANCH}"
              fi
            done

        - name: push-tags
          script: |
            if [ "${PUSH_TAGS}" = "false" ]; then
              echo "Skipping tags (PUSH_TAGS=false)"
              exit 0
            fi

            FORCE_FLAG=""
            if [ "${FORCE_PUSH}" = "true" ]; then
              FORCE_FLAG="--force"
            fi

            if [ "${DRY_RUN}" = "true" ]; then
              echo "[DRY RUN] Would push: all tags ${FORCE_FLAG}"
              git tag -l | head -20
            else
              echo "Pushing all tags..."
              git push github --tags ${FORCE_FLAG} 2>&1 || echo "WARN: failed to push some tags"
            fi

        - name: summary
          script: |
            echo "=== CNB → GitHub Sync Summary ==="
            echo "Target: sixiang-world/simplereader"
            echo "Force Push: ${FORCE_PUSH:-false}"
            echo "Branches: ${PUSH_BRANCH:-all local}"
            echo "Tags: ${PUSH_TAGS:-true}"
            echo "Dry Run: ${DRY_RUN:-false}"
            echo "==============================="
